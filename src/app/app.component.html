<ion-app>
  <ion-split-pane contentId="main-content" when="md">
    <ion-menu contentId="main-content">
      <ion-header>
        <ion-toolbar>
          <ion-title class="font-display">The Palate</ion-title>
        </ion-toolbar>
      </ion-header>

      <ion-content class="menu-content">
        <div class="menu-user" *ngIf="authService.currentUser as user">
          <div class="avatar"><ion-icon name="person"></ion-icon></div>
          <div class="user-text">
            <p class="name">{{ user.name }}</p>
            <p class="email">{{ user.email }}</p>
          </div>
        </div>

        <div class="menu-guest" *ngIf="!authService.currentUser">
          <p>You're browsing as a guest.</p>
          <button (click)="go('/login')">Sign In</button>
        </div>

        <ion-list lines="none">
          <ion-item button (click)="go('/tabs/home')">
            <ion-icon name="home-outline" slot="start"></ion-icon>
            <ion-label>Home</ion-label>
          </ion-item>
          <ion-item button (click)="go('/tabs/category')">
            <ion-icon name="search-outline" slot="start"></ion-icon>
            <ion-label>Categories</ion-label>
          </ion-item>
          <ion-item button (click)="go('/tabs/favorites')">
            <ion-icon name="cart-outline" slot="start"></ion-icon>
            <ion-label>Favorites</ion-label>
          </ion-item>
          <ion-item button (click)="go('/tabs/save')">
            <ion-icon name="location-outline" slot="start"></ion-icon>
            <ion-label>Saved</ion-label>
          </ion-item>
          <ion-item button (click)="go('/bookings')" *ngIf="authService.currentUser">
            <ion-icon name="calendar-outline" slot="start"></ion-icon>
            <ion-label>My Bookings</ion-label>
          </ion-item>
        </ion-list>

        <button class="logout-btn" *ngIf="authService.currentUser" (click)="logout()">
          <ion-icon name="log-out-outline"></ion-icon>
          Log Out
        </button>
      </ion-content>
    </ion-menu>

    <ion-router-outlet id="main-content"></ion-router-outlet>
  </ion-split-pane>
</ion-app>
